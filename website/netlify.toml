[build]
  command = "npm run build"
  publish = "out"
  # Build only if changes are detected in website/ or docs/
  # Netlify runs this command from the base directory (website/)
  # 0 = ignore (skip build), 1 = proceed with build
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../docs"

[[plugins]]
  package = "@netlify/plugin-nextjs"
