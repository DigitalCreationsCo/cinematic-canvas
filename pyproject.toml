[project]
name = "portals"
version = "0.1.0"
description = "Python package for Portals, a filmmaking workspace application"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "portals-base[complete]",
]


[tool.uv.sources]
portals = { workspace = true }
px = { workspace = true }
torch = { index = "pytorch-gpu" }
torchvision = { index = "pytorch-gpu" }
portals-base = { workspace = true }
portals-sdk = { workspace = true }

[tool.uv.workspace]
members = [
    "src/backend/base",
    ".",
    "src/px",
    "src/sdk",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend/base"]

[project.optional-dependencies]
postgresql = [
    "sqlalchemy[aiosqlite,postgresql-psycopg,postgresql-psycopg2binary]>=2.0.49",
]

[project.scripts]
portals = "portals.portals_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]
