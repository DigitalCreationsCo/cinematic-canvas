[package]
name = "portals-desktop"
version = "0.1.0"
description = "Portals Desktop — content-addressed narrative entity management"
authors = ["Vibrantceo"]
edition = "2021"

[lib]
name = "portals_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri ──
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# ── Serialisation ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# ── Async runtime ──
tokio = { version = "1", features = ["full"] }

# ── Portals stack ──
# nap-core 0.3.1 — Narrative Addressing Protocol core library
# Provides: Resolver, RepoService, NapUri, NapError, VcsBackend trait, Repository.
nap-core = "0.3.1"

# ── HTTP client for lore-server content API (asset get/put) ──
reqwest = { version = "0.12", features = ["json"] }

# ── Content hashing (BLAKE3, matching lore's scheme) ──
blake3 = "1"

# ── Error handling ──
thiserror = "2"

# ── Filesystem utilities ──
dirs = "6"
walkdir = "2"

# ── Date/time formatting (RFC 3339 timestamps) ──
chrono = "0.4"
